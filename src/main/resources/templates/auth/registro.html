<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}">
    <meta charset="UTF-8">
    <title>Crear cuenta · Clínica Santa Elena</title>
    <link rel="stylesheet" href="../../static/css/app.css">
</head>
<body>
<!-- P02 - Registro de paciente (RF01, Ley 29733) -->
<header class="barra">
    <div class="barra-in"><a class="marca" th:href="@{/login}" href="login.html"><span class="marca-icono">+</span>Clínica Santa Elena</a></div>
</header>
<main class="contenido">
    <h1>Crea tu cuenta de paciente</h1>
    <p class="sub">Solo pedimos los datos necesarios para registrar tus citas.</p>

    <div class="alerta alerta-error" th:if="${error}" th:text="${error}">Ya existe una cuenta con ese correo</div>

    <form class="tarjeta" th:action="@{/registro}" th:object="${form}" method="post" novalidate>
        <div class="grid-2">
            <div>
                <label for="dni">DNI</label>
                <input type="text" id="dni" th:field="*{dni}" maxlength="8" inputmode="numeric" value="72345678">
                <div class="campo-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">El DNI debe tener 8 dígitos</div>

                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" th:field="*{nombres}" value="María">
                <div class="campo-error" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>

                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" th:field="*{apellidos}" value="Torres Salas">
                <div class="campo-error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>

                <label for="telefono">Celular (opcional)</label>
                <input type="tel" id="telefono" th:field="*{telefono}" maxlength="9" value="987654321">
                <div class="campo-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
            </div>
            <div>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" th:field="*{correo}" value="maria.torres@correo.pe">
                <div class="campo-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">
                <div class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                <p class="ayuda">Mínimo 8 caracteres, con letras y números, y sin tu DNI.</p>

                <label for="confirmarPassword">Repite la contraseña</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword">

                <label class="check"><input type="checkbox" th:field="*{aceptaDatos}" checked>
                    Autorizo a la Clínica Santa Elena a tratar mis datos personales solo para la gestión de mis
                    citas, conforme a la Ley N.° 29733.</label>
                <div class="campo-error" th:if="${#fields.hasErrors('aceptaDatos')}" th:errors="*{aceptaDatos}"></div>
            </div>
        </div>
        <p></p>
        <button type="submit" class="btn btn-primario">Crear cuenta</button>
        <a class="btn btn-secundario" th:href="@{/login}" href="login.html">Ya tengo cuenta</a>
    </form>
</main>
</body>
</html>
